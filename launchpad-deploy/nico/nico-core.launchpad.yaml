## nico-core values for launchpad — pass to setup.sh via --core-values.
## Networking is fully filled for launchpad (172.16.2.0/24, VIPs .40–.49, reserve_first=50).
## global.image.repository/tag come from NICO_IMAGE_REGISTRY/NICO_CORE_IMAGE_TAG via --set (leave blank).
## FILL_ME = you must supply (domain + boot-artifacts/unbound images). See nico-core.fills.md.

global:
  image:
    repository: ""    # set via --set (NICO_IMAGE_REGISTRY)/nvmetal-carbide
    tag: ""           # set via --set (NICO_CORE_IMAGE_TAG)
    pullPolicy: IfNotPresent
  imagePullSecrets:
    - name: imagepullsecret
  certificate:
    duration: 720h0m0s
    renewBefore: 360h0m0s
    privateKey:
      algorithm: ECDSA
      size: 384
    issuerRef:
      kind: ClusterIssuer
      name: vault-nico-issuer
      group: cert-manager.io
  spiffe:
    trustDomain: nico.local

nico-api:
  hostname: "api-launchpad.nvidialaunchpad.internal"   # default from launchpad-docs internal domain; change if you have another
  auth:
    additionalIssuerCns:
      - "site-root"
  externalService:
    enabled: true
    # Gate-1/api fix (2026-06-29): off-subnet clients (DPU/host at 172.16.4.x, reached via the EVPN
    # fabric -> gw .1) connect to the .40 VIP but the SYN-ACK comes back from the POD IP:targetPort
    # (e.g. 10.233.79.148:1079) instead of 172.16.2.40:443, so they RST and time out. Cause: ETP=Local
    # makes kube-proxy SKIP masquerade (KUBE-LOAD-BALANCER-LOCAL -> RETURN), and for a routed client
    # ipvs never reverse-translates the pod's reply back to the VIP. Cluster marks the traffic for
    # MASQUERADE so the pod replies to the node and the node reverse-NATs -> client always sees .40:443.
    # SAFE here: .40 is a DEDICATED VIP (vip-pool-external, NOT shared) so no MetalLB sharing wedge like
    # .43; and losing client-IP is OK because discover_machine's find_by_ip_or_id falls back to the
    # scout-supplied interface_id when the source IP doesn't match a machine_interface.
    # RECONCILED 2026-07-02 to match live cluster: Local (nico-api is reached on-subnet from the DPU
    # mgmt net, so Local works; the Cluster/off-subnet-reverse-NAT rationale above was superseded).
    externalTrafficPolicy: Local
    annotations:
      metallb.universe.tf/loadBalancerIPs: "172.16.2.40"
  certificate:
    extraDnsNames:
      - "api-launchpad.nvidialaunchpad.internal"  # match hostname above
      - "carbide-api.forge"
      - "nico-api.forge"
      - "carbide-api.forge-system.svc.cluster.local"
  siteConfig:
    enabled: true
    nicoApiSiteConfig: |
      sitename = "rg-forge-launchpad"
      initial_domain_name = "launchpad.nvidialaunchpad.internal"   # base DNS domain (from docs); change if needed
      attestation_enabled = true   # RECONCILED 2026-07-02 to match live
      max_concurrent_machine_updates = 20

      dhcp_servers = ["172.16.2.41"]

      route_servers = []
      enable_route_servers = false
      
      # This is a work-around to a Cumulus route-leaking
      # limitation and will result in all VPCs getting the same VNI.
      # Route-targets will still use the normal, dynamically
      # allocated VNI for route-targets, so this only places
      # a limit on the number of isolated VRFs that a single DPU will
      # support, which is a single VRF if this option is used.
      # This value must match the VNI being used for the VRF on the Cumulus TOR
      site_global_vpc_vni = 245002

      # 172.16.3.0/24 (N-S underlay) is the tenant fabric -> site_fabric_prefixes only.
      # deny_prefixes must NOT overlap site_fabric_prefixes (nico-api hard-validates this).
      site_fabric_prefixes = ["172.16.4.128/25"]
      # RECONCILED 2026-07-07 to match live: deny_prefixes emptied (deny nothing). Earlier this held the
      # 7-CIDR complement of 172.16.2.0/24 (deny the mgmt underlay except the .40-.49 VIP block) as the
      # GB300 no-PXE workaround; the team set it to [] on the live cluster (no deny at all — also avoids
      # the DPU HBN drop, at the cost of the mgmt-underlay isolation). Live is the source of truth here.
      deny_prefixes = []

      # --- FNN / EVPN admin-VPC route targets (provided by the network team). In DPU mode the
      # tray host boots through the DPU on the admin/overlay net (172.16.4.x) and must reach the
      # mgmt-network services (nico-pxe 172.16.2.43). NICo programs these route-target imports/exports
      # onto the DPU VRFs so the admin VPC's routes are announced on the DPU<->core-switch L2VPN/EVPN
      # session (the session Brian observed announcing nothing). datacenter_asn must be top-level.
      datacenter_asn = 32325

      [fnn.admin_vpc]
      enabled = true
      vpc_vni = 60300

      [fnn.routing_profiles.INTERNAL]
      internal = true
      route_target_imports = [
        { asn = 32325, vni = 10 },   # import the default route
        { asn = 32326, vni = 245001 },
        { asn = 32327, vni = 245001 },
        { asn = 32328, vni = 245001 },
        { asn = 32329, vni = 245001 },
      ]
      route_targets_on_exports = [
        { asn = 32325, vni = 50200 },   # common internal route tag
        { asn = 32326, vni = 245001 },
        { asn = 32327, vni = 245001 },
        { asn = 32328, vni = 245001 },
        { asn = 32329, vni = 245001 },
      ]

      [fnn.routing_profiles.EXTERNAL]
      internal = false
      route_target_imports = [
        { asn = 32325, vni = 10 },   # import the default route (FNN GW injects it for external)
        { asn = 32326, vni = 245001 },
        { asn = 32327, vni = 245001 },
        { asn = 32328, vni = 245001 },
        { asn = 32329, vni = 245001 },
      ]
      route_targets_on_exports = [
        { asn = 32325, vni = 50500 },   # common external route tag
        { asn = 32327, vni = 245001 },
        { asn = 32328, vni = 245001 },
        { asn = 32329, vni = 245001 },
      ]

      [fnn.routing_profiles.MAINTENANCE]
      internal = true
      route_target_imports = [
        { asn = 32325, vni = 10 },   # import the default route
        { asn = 32326, vni = 245001 },
        { asn = 32327, vni = 245001 },
        { asn = 32328, vni = 245001 },
        { asn = 32329, vni = 245001 },
      ]
      route_targets_on_exports = [
        { asn = 32325, vni = 50300 },   # common breakfix route tag
        { asn = 32327, vni = 245001 },
        { asn = 32328, vni = 245001 },
        { asn = 32329, vni = 245001 },
      ]

      [fnn.admin_vpc.routing_profile]
      internal = true
      route_target_imports = [
        { asn = 32325, vni = 10 },   # import the default route
        { asn = 32326, vni = 245001 },
        { asn = 32327, vni = 245001 },
        { asn = 32328, vni = 245001 },
        { asn = 32329, vni = 245001 },
      ]
      route_targets_on_exports = [
        { asn = 32325, vni = 50400 },   # common admin route tag
        { asn = 32325, vni = 50200 },   # common internal route tag
        { asn = 32327, vni = 245001 },
        { asn = 32328, vni = 245001 },
        { asn = 32329, vni = 245001 },
      ]

      [site_explorer]
      enabled = true
      run_interval = "30s"
      # allow_zero_dpu_hosts: requested by the rack ticket. NOTE: NOT a recognized field in the running
      # pr-503 SiteExplorerConfig — SiteExplorerConfig has no deny_unknown_fields, so it is silently
      # IGNORED (no-op). Kept here to match the ticket; harmless. Revisit if a newer nico-api adds it.
      allow_zero_dpu_hosts = false
      # Create switch + power-shelf objects during exploration so the 9 NVIDIA switches and 6 LiteOn
      # power shelves get ingested (rack config, Jira "Setup rack and component manager configs").
      create_switches = true
      create_power_shelves = true
      # GB300 trays expose TWO Redfish Systems (HGX_Baseboard_0 = no BIOS, System_0 = Lenovo host w/ BIOS).
      # The default "libredfish" client picks the first System (HGX_Baseboard_0) and 404s on its missing
      # /Bios -> 0 machines ingested. The NVIDIA "nv-redfish" client has GB300-aware handling
      # (bmc-explorer/hw/lenovo_gb300.rs) that selects the host System. REQUIRED for GB300 ingestion.
      explore_mode = "nv-redfish"

      # Disabled for first GB300 bring-up: machine_validation reboots the host and runs
      # scout HW tests that Fail->block Ready; not needed to prove ingestion. Re-enable later.
      [machine_validation_config]
      enabled = true   # RECONCILED 2026-07-02 to match live
      # Disable the long DCGM diagnostic (forge_DcgmFullLong): it FAILS on the GB300 trays and
      # blocks Ready (per Krish 2026-07-03). test_selection_mode defaults to "Default", which only
      # updates tests listed here and leaves every other MV test as-is in the DB. The id MUST equal
      # the DB test_id — api-db migrations seed 'forge_DcgmFullLong', matched exactly by
      # api-core apply_config_on_startup (handlers/machine_validation.rs:995).
      tests = [
        { id = "forge_DcgmFullLong", enable = false },
      ]

      [bom_validation]
      enabled = true
      ignore_unassigned_machines = true

      # lo-ip: DPU loopbacks — dormant on launchpad (DPU offload off / route_servers off),
      # but the pool must exist. Non-routed 10.255.x so it can't collide with site nets.
      [pools.lo-ip]
      type = "ipv4"
      ranges = [{ start = "172.16.3.16", end = "172.16.3.216" }]

      [pools.vlan-id]
      type = "integer"
      ranges = [{ start = "2000", end = "3000" }]

      [pools.vni]
      type = "integer"
      ranges = [{ start = "1024500", end = "1024800" }]

      [pools.vpc-vni]
      type = "integer"
      ranges = [{ start = "60200", end = "60300" }]

      # Per-DPU BGP ASN pool for FNN. REQUIRED once [fnn] is enabled: each DPU is
      # allocated a unique ASN from here (update_dpu_asns backfills any DPU with
      # asn IS NULL on nico-api startup). Without this pool, update_dpu_asns logs
      # "FNN ASN pool not configured or fully allocated" and skips, so every DPU's
      # GetManagedHostNetworkConfig fails ("DPU has not been assigned an ASN").
      # Range = the upstream default 4-byte private-ASN block; the core switch must
      # accept these ASNs on the DPU EVPN/L2VPN session -- CONFIRM RANGE WITH NETWORK TEAM.
      [pools.fnn-asn]
      type = "integer"
      # NOTE: nico-api caps any resource pool at 250000 entries (setup.rs:370) -- a full
      # /M block (4268000000-4268999999 = 1,000,000) crashes nico-api at startup. We only
      # need one ASN per DPU (~18), so keep this small. CONFIRM exact ASNs with the network team.
      ranges = [{ start = "4268000000", end = "4268000099" }]

      # Placeholder admin segment. nico-api REQUIRES a [networks.admin] block with non-empty
      # prefix/gateway to parse at startup (else it panics), but launchpad has no separate admin
      # network and zero-DPU/NIC-mode hosts use HostInband/underlay (machine_creator.rs:442), NOT
      # admin — so nothing is ever allocated here. Small unused prefix to avoid overlap with the
      # real nets (172.16.0/2/3/5 are taken; 172.16.4.0/24 is free).
      [networks.admin]
      type = "admin"
      prefix = "172.16.4.0/25"
      gateway = "172.16.4.1"
      mtu = 1500
      reserve_first = 5

      # Managed-host BMC + host-OOB discovery network (VLAN 200, 172.16.2.0/24). MUST be type=underlay:
      # site-explorer ONLY scans underlay segments (lib.rs:1564 list_segment_ids(Underlay)); it explicitly
      # skips admin/tenant segments, so BMCs on an admin segment are never probed. The DHCP relay's giaddr
      # (cp-1 bond0 .11) matches this segment by subnet membership (api-db for_relay_all `ip <<= prefix`).
      # reserve_first=50 fences SC statics (.11-.13) + MetalLB VIPs (.40-.49) off the lease pool (.50-.250).
      [networks.launchpad-mgmt]
      type = "underlay"
      prefix = "172.16.2.0/24"
      gateway = "172.16.2.1"
      mtu = 1500
      reserve_first = 50

      [ib_config]
      enabled = false

      [firmware_global]
      autoupdate = false
      no_reset_retries = true

      [machine_state_controller]
      failure_retry_time = "90m"

      # --- Rack + Component-Manager config (Jira "Setup rack and component manager configs in NICo").
      # This is the team-confirmed RMS-backed variant. NOTE: the source draft had a typo
      # ([rack_profiles.NVL72_300...] on power_shelf) — FIXED here to NVL72_GB300, else the
      # power_shelf_backend="rms" startup validator rejects the profile (missing power_shelf.vendor)
      # and nico-api won't boot. RMS clients are lazy so nico-api starts before RMS exists, but with
      # *_use_state_controller=true the state controllers will error/retry against
      # rms-api-server.rack-manager until RMS is deployed. See launchpad-deploy/nico/RACK-CONFIG.md.
      [rack_profiles.NVL72_GB300]
      product_family = "gb300"
      rack_hardware_topology = "gb300_nvl72r1_c2g4_topology"

      [rack_profiles.NVL72_GB300.rack_capabilities.compute]
      name = "GB300"
      vendor = "Lenovo"
      count = 18

      [rack_profiles.NVL72_GB300.rack_capabilities.switch]
      vendor = "NVIDIA"
      count = 9

      [rack_profiles.NVL72_GB300.rack_capabilities.power_shelf]
      vendor = "LiteOn"
      count = 6

      [component_manager]
      compute_tray_backend = "rms"
      nv_switch_backend = "rms"
      power_shelf_backend = "rms"
      nv_switch_use_state_controller = true
      power_shelf_use_state_controller = true
      compute_tray_use_state_controller = true

      [rms]
      api_url = "https://rms-api-server.rack-manager.svc.cluster.local:8801"
      enforce_tls = true
      # RMS mTLS. The rack ticket asked for [rms.tls] cert_dir="/var/run/secrets/spiffe.io", but pr-503
      # RmsConfig has no [rms.tls] subtable — it uses these flat paths. nico-api mounts its
      # vault-nico-issuer cert (secret nico-api-certificate) at /var/run/secrets/spiffe.io, and RMS's
      # client-CA (rms-api-server --tls-ca) is the SAME vault-nico CA (verified: ca.crt sha matches) →
      # mTLS succeeds. RMS server cert is also vault-nico-issued for rms-api-server.rack-manager.svc.
      root_ca_path = "/var/run/secrets/spiffe.io/ca.crt"
      client_cert = "/var/run/secrets/spiffe.io/tls.crt"
      client_key = "/var/run/secrets/spiffe.io/tls.key"

nico-dhcp:
  externalService:
    enabled: true
    # Persist (declaratively, replacing the 2026-06-24 kubectl-patch) the removal of the DHCP
    # LoadBalancer NodePort. MetalLB-L2 serves the .41 VIP directly and never uses the NodePort;
    # for this UDP/67 service the extra NodePort added needless IPVS/conntrack state implicated in
    # the DHCP OFFER return-path break (launchpad-bringup/INCIDENT-DHCP-ROOTCAUSE.md). Matches prod
    # (rg-forge-ytl nico-dhcp-external also = false). Orthogonal to ETP=Cluster (chart default), which
    # is what makes Kea's reply egress from the .41 VIP and must stay.
    allocateLoadBalancerNodePorts: false
    annotations:
      metallb.universe.tf/loadBalancerIPs: "172.16.2.41"
  config:
    kea:
      hookParameters:
        nameservers: "172.16.2.42"                       # unbound VIP (serves .forge)
        ntpServer: "172.16.2.44,172.16.2.45,172.16.2.46" # nico-ntp VIPs
        provisioningServer: "172.16.2.43"                # nico-pxe VIP

nico-dns:
  externalService:
    enabled: true
    perPodAnnotations:
      - metallb.universe.tf/loadBalancerIPs: "172.16.2.47"
      - metallb.universe.tf/loadBalancerIPs: "172.16.2.48"

nico-pxe:
  externalService:
    enabled: true
    # NOTE (2026-06-29): do NOT set externalTrafficPolicy: Cluster here. nico-pxe-external (8080) and
    # nico-pxe-external-80 (80) SHARE the .43 VIP via metallb allow-shared-ip=nico-pxe. Flipping ETP
    # on a shared-IP service triggers a MetalLB shared-IP reallocation that gets stuck ("can't change
    # sharing key ... address also in use ... no retry") and leaves the 8080 VIP <pending> -> hosts
    # can't reach pxe on 8080. Keep ETP=Local (default). The Gate-1 source-NAT fix must instead be
    # done by PINNING the MetalLB L2 announcer for .43 to the pxe pod's node (nodeSelector on a
    # per-pool L2Advertisement), not via ETP=Cluster.
    annotations:
      metallb.universe.tf/loadBalancerIPs: "172.16.2.43"
  # aarch64 ONLY (Grace host + BlueField-3 DPU). No x86_64 (no x86 managed hosts).
  # BUMPED 2026-06-30 pr-70 -> pr-461 to MATCH Core (v2.0.0-pr-461-g1bbbccd53). The forge-scout AND
  # forge-dpu agents ship from THIS image's /apt repo, NOT from the Core image — so Core pr-461 alone
  # did NOT carry the scrub fix (#2975, crates/scout/.../scrabbing.rs zero-size skip) to hosts; the
  # served forge-scout deb was still pr-70. This bump ships the pr-461 forge-scout + forge-dpu agents.
  # NOTE: this also rolls the DPU agent pr-70 -> pr-461 (re-test the DPU side) and replaces the stock
  # ipxe.efi -> the in-pod ipxe.efi override must be RE-COPIED after this deploy (pod restarts, emptyDir
  # repopulated). COPY PATH = /forge-boot-artifacts/blobs/internal (PR #2813). COPY COMMAND MUST MATCH
  # the image's top-level dirs — VERIFY pr-461 still ships /aarch64 + /apt (NOT /firmware) before deploy,
  # else the init crash-loops on `cp: can't stat`.
  bootArtifactContainers:
    - name: boot-artifacts-aarch64
      image: "nvcr.io/0837451325059433/carbide-dev/boot-artifacts-aarch64:v2.0.0-pr-503-g49a48a69d"  # matches Core pr-503 (ships the updated iPXE, #2997 — may obviate Stoo's manual snponly.efi override)
      command: ["sh", "-c", "cp -r /aarch64 /apt /forge-boot-artifacts/blobs/internal"]
  certificate:
    extraDnsNames:
      - "carbide-pxe.forge"
      - "nico-pxe.forge"
      - "carbide-static-pxe.forge"
      - "carbide-pxe.forge-system.svc.cluster.local"

nico-ssh-console-rs:
  # GOTCHA (dev8-install.md): this subchart reads its OWN .Values.imagePullSecrets, NOT
  # global.imagePullSecrets — without this it does an anonymous pull and 403s.
  imagePullSecrets:
    - name: imagepullsecret
  externalService:
    enabled: true
    annotations:
      metallb.universe.tf/loadBalancerIPs: "172.16.2.49"

nico-ntp:
  externalService:
    enabled: true
    perPodAnnotations:
      - metallb.universe.tf/loadBalancerIPs: "172.16.2.44"
      - metallb.universe.tf/loadBalancerIPs: "172.16.2.45"
      - metallb.universe.tf/loadBalancerIPs: "172.16.2.46"

nico-dsx-exchange-consumer:
  enabled: false

unbound:
  enabled: true
  # PUBLIC stock image (matches the validated ytl-shard-2 deploy): no NGC token needed,
  # exporter disabled (avoids the nvforge remote-control dependency). The command/args
  # generate /tmp/unbound.conf and include the chart's .forge local-data fragments.
  image:
    repository: docker.io/alpinelinux/unbound
    tag: latest
  exporter:
    enabled: false
  command:
    - /bin/sh
    - -c
  args:
    - |
      cat > /tmp/unbound.conf <<EOF
      server:
        do-daemonize: no
        verbosity: 1
        interface: 0.0.0.0
        interface: ::0
        access-control: 0.0.0.0/0 allow
        chroot: ""
        username: ""
        directory: "/etc/unbound"
        so-rcvbuf: 0
        so-sndbuf: 0
      include: "/etc/unbound/local.conf.d/*.conf"
      EOF
      exec unbound -d -c /tmp/unbound.conf
  externalService:
    enabled: true
    annotations:
      metallb.universe.tf/loadBalancerIPs: "172.16.2.42"
  localConfig:
    forwarders.conf: |
      forward-zone:
          name: .
          forward-addr: 172.16.0.1     # site resolver (confirm)
  localData:
    - name: carbide-api.forge
      addresses: ["172.16.2.40"]
    - name: nico-api.forge
      addresses: ["172.16.2.40"]
    - name: carbide-pxe.forge
      addresses: ["172.16.2.43"]
    - name: nico-pxe.forge
      addresses: ["172.16.2.43"]
    - name: carbide-static-pxe.forge
      addresses: ["172.16.2.43"]
    - name: carbide-ntp.forge
      addresses: ["172.16.2.44", "172.16.2.45", "172.16.2.46"]
    - name: nico-ntp.forge
      addresses: ["172.16.2.44", "172.16.2.45", "172.16.2.46"]
    - name: unbound.forge
      addresses: ["172.16.2.42"]
