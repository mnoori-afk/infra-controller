# teleport-kube-agent Helm values — onboards the nvcert k8s cluster into Teleport
# so `tsh kube login launchpad-nvcert` works.
# Mirrors launchpad-deploy/teleport/kube-agent-values.yaml.
#
# PREREQ: the kube join token "rg-forge-launchpad-nvcert" must be registered on nv-stg
# (separate from the SSH TPM token). Ask the platform team to create it via
# stardrive components/teleport/joincluster.sh or tctl (roles: [Kube], join_method: kubernetes).
#
# Deploy after k8s is up and NICo Core is installed:
#   helm upgrade --install teleport-kube-agent teleport/teleport-kube-agent \
#     --version 18.7.6 \
#     --namespace teleport --create-namespace \
#     -f launchpad-nvcert/teleport/kube-agent-values.yaml

roles: "kube"
proxyAddr: "nv-stg-dgxc.teleport.sh:443"
teleportClusterName: "nv-stg-dgxc.teleport.sh"

kubeClusterName: "launchpad-nvcert"   # appears in `tsh kube ls` and `tsh kube login launchpad-nvcert`

enterprise: true

joinParams:
  method: kubernetes
  type: static_jwks
  tokenName: "rg-forge-launchpad-nvcert"   # MUST match the kube token registered on nv-stg

labels:
  environment: non-prod
  resource-group: forge

highAvailability:
  replicaCount: 1

adminClusterRoleBinding:
  create: true
  name: access-forge-dgxc-prod-admin

updater:
  enabled: false
log:
  format: json
podMonitor:
  enabled: false
