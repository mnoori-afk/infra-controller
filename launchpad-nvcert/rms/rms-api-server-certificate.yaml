apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: rms-api-server-certificate
  namespace: rack-manager
spec:
  secretName: rms-api-server-certificate
  duration: 720h0m0s
  renewBefore: 360h0m0s
  privateKey:
    algorithm: ECDSA
    size: 384
  dnsNames:
    - rms-api-server.rack-manager.svc.cluster.local
  uris:
    - spiffe://nico.local/rack-manager/sa/rms-api-server
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: vault-nico-issuer
