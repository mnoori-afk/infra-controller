# cp-3 (nvcert-control-plane-3) — site-controller OS mgmt, persistent static.
# MACs: ens6f0np0=6c:83:75:25:6d:14  ens6f1np1=6c:83:75:25:6d:15
# Mirrors the stock subiquity structure (ens6* match -> bond0 active-backup),
# switched from DHCP to a static address on 172.16.2.0/24 (VLAN 200).
network:
  version: 2
  renderer: networkd
  ethernets:
    ens6:
      dhcp4: false
      match:
        name: ens6*
  bonds:
    bond0:
      dhcp4: false
      interfaces: [ens6]
      addresses: [172.16.2.13/24]
      routes:
        - to: default
          via: 172.16.2.1
      nameservers:
        addresses: [172.16.0.1]
      parameters:
        mode: active-backup
        mii-monitor-interval: 100
        transmit-hash-policy: layer3+4
