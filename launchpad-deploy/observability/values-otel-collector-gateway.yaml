# OTEL Collector — GATEWAY (Deployment). The central OTLP/mTLS receiver the DPU dials at
# otel-receiver.forge:443. Receives DPU (bluefield/charts/nico-otelcol) DOCA/HBN/kernel/auth logs +
# host metrics -> local Loki (logs) + prometheus/site (metrics, scraped by Prometheus).
# Derived from forged/bases/opentelemetry-collector/values.yaml `logs/dpu` + `metrics` pipelines,
# MINUS Panoptes/Kratos (no otlphttp/*-panoptes, no oauth2client, no logzio).
#
# mTLS TRUST CHAIN (verified live on DPU 172.16.2.76, 2026-07-15): the DPU trusts CN=site-root (its
# /etc/otelcol-contrib/certs/ca.pem, fp 31:9A:1F:…) and presents a client cert ALSO signed by site-root. So:
#   - server cert (otel-receiver-tls) is issued by **site-issuer** (leaf signed by site-root)
#   - client_ca_file = that cert secret's own ca.crt (= site-root) -> verifies the DPU's client cert
# NOT nico-rest-ca-issuer / "NICo Local Dev CA" — the DPU does not trust that CA (caused the x509 handshake fail).
#
# IMAGE PIN: see values-otel-collector-agent.yaml (loki exporter removed after 0.106).
mode: deployment
# Name all resources exactly `otel-collector-gateway` (default would be
# `otel-collector-gateway-opentelemetry-collector`). Keeps the Service name matching the Prometheus
# scrape target (values-kube-prometheus-stack.yaml) and the `deploy/otel-collector-gateway` refs in docs.
fullnameOverride: otel-collector-gateway
replicaCount: 1
image:
  repository: "otel/opentelemetry-collector-contrib"
  tag: "0.106.1"
# Site label value (v2 pattern). For the nvcert sibling site, change ONLY this value.
extraEnvs:
  - name: OTEL_SITE_NAME
    value: "launchpad"
# DPU dials :443; the OTLP gRPC receiver listens on 4317 -> Service maps servicePort 443 to containerPort 4317.
ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 443
    protocol: TCP
  prometheus:
    enabled: true
    containerPort: 9999
    servicePort: 9999
    protocol: TCP
service:
  type: LoadBalancer
  # ETP=Local: the DPU otelcol dials .30 ON-SUBNET from its mgmt IP (172.16.2.x), same L2 segment as the
  # MetalLB VIP — verified live (DPU agents reach nico-api .40 from 172.16.2.73/.76/.119). Matches the
  # reconciled nico-api .40 (also Local). .30 is a DEDICATED VIP so no shared-key wedge like pxe .43;
  # mTLS authenticates via the DPU client cert, so client-IP preservation is a bonus, not a requirement.
  externalTrafficPolicy: Local
  annotations:
    metallb.universe.tf/loadBalancerIPs: "172.16.2.30"   # otel-receiver.forge (add to unbound + MetalLB pool)
extraVolumes:
  - name: otlp-server-cert
    secret:
      secretName: otel-receiver-tls        # site-issuer: tls.crt/tls.key (server) + ca.crt (= site-root, the DPU's trust anchor AND its client-cert CA)
extraVolumeMounts:
  - {name: otlp-server-cert, mountPath: /etc/otel/tls, readOnly: true}
config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: ${env:MY_POD_IP}:4317
          tls:
            cert_file: /etc/otel/tls/tls.crt
            key_file: /etc/otel/tls/tls.key
            client_ca_file: /etc/otel/tls/ca.crt         # verify the DPU client cert against site-root (the cert secret's own ca.crt)
    prometheus/local-telemetry:
      config:
        scrape_configs:
          - job_name: opentelemetry-collector
            scrape_interval: 10s
            static_configs:
              - targets: ["${env:MY_POD_IP}:8888"]
            metric_relabel_configs:
              - {action: labeldrop, regex: "service_instance_id|service_name"}
  processors:
    memory_limiter:
      limit_percentage: 80
      spike_limit_percentage: 25
      check_interval: 1s
    # v2's resource/site-label-loki — single source of the forge_site value (${env:OTEL_SITE_NAME}).
    resource/site-label-loki:
      attributes:
        - {action: insert, key: forge_site, value: "${env:OTEL_SITE_NAME}"}
    resource/dpu-logs-loki:
      attributes:
        - action: insert
          key: loki.resource.labels
          value: forge_site, exporter, machine.id, host.machine.id, host.name, component
        - {action: insert, key: loki.format, value: raw}
    transform/dpu-logs-loki:
      error_mode: ignore
      log_statements:
        - context: log
          statements:
            - set(attributes["loki.attribute.labels"], "systemd.unit") where resource.attributes["component"] == "journald"
            - set(attributes["loki.attribute.labels"], "log.file.path") where resource.attributes["component"] == "hbn" or resource.attributes["component"] == "dpu-auth-filelog"
    transform/metrics:
      metric_statements:
        - context: datapoint
          statements:
            - set(attributes["host.name"], resource.attributes["host.name"])
            - set(attributes["process.name"], resource.attributes["process.executable.name"])
            - set(attributes["component"], resource.attributes["component"])
    batch: {}
  exporters:
    loki:
      endpoint: http://loki.loki.svc.cluster.local:3100/loki/api/v1/push
      headers:
        X-Scope-OrgID: forge
      default_labels_enabled:
        exporter: false
    prometheus/site:
      endpoint: ${env:MY_POD_IP}:9999
      resource_to_telemetry_conversion:
        enabled: false
  service:
    pipelines:
      logs/dpu:
        receivers: [otlp]
        processors: [memory_limiter, resource/site-label-loki, resource/dpu-logs-loki, transform/dpu-logs-loki, batch]
        exporters: [loki]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, transform/metrics, batch]
        exporters: [prometheus/site]
      metrics/local-telemetry:
        receivers: [prometheus/local-telemetry]
        processors: [memory_limiter, batch]
        exporters: [prometheus/site]
    telemetry:
      metrics:
        address: ${env:MY_POD_IP}:8888
# Prometheus scrapes :9999 via the additionalScrapeConfig in values-kube-prometheus-stack.yaml.
