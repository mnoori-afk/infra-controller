# teleport-kube-agent Helm values — onboards the nvcert k8s cluster into Teleport
# so `tsh kube login rg-forge-<SITE_NAME>` works.
# Mirrors launchpad-deploy/teleport/kube-agent-values.yaml.
#
# PREREQ: the kube join token "rg-forge-<SITE_NAME>" must be registered on nv-stg.
# This is a SEPARATE token from the SSH TPM token (nvcert-token.yaml).
# Ask the platform team to create it (roles: [Kube], join_method: kubernetes)
# via stardrive components/teleport/joincluster.sh or tctl.
#
# Deploy after k8s is up and NICo Core is installed:
#   helm upgrade --install teleport-kube-agent teleport/teleport-kube-agent \
#     --version 18.7.6 \
#     --namespace teleport --create-namespace \
#     -f launchpad-nvcert/teleport/kube-agent-values.yaml

roles: "kube"
proxyAddr: "nv-stg-dgxc.teleport.sh:443"

# MUST equal the Teleport cluster name (no port). Omitting causes "invalid audience claim".
teleportClusterName: "nv-stg-dgxc.teleport.sh"

# How this cluster appears in `tsh kube ls`. Replace <SITE_NAME> with the agreed name.
kubeClusterName: "rg-forge-<SITE_NAME>"

enterprise: true

joinParams:
  method: kubernetes
  type: static_jwks
  tokenName: "rg-forge-<SITE_NAME>"   # MUST match the kube token registered on nv-stg

labels:
  environment: non-prod
  resource-group: forge

highAvailability:
  replicaCount: 1

# Grants cluster-admin to the access-forge-dgxc-prod-admin Teleport kube group
# (the group your tsh profile carries).
adminClusterRoleBinding:
  create: true
  name: access-forge-dgxc-prod-admin

updater:
  enabled: false
log:
  format: json
podMonitor:
  enabled: false
