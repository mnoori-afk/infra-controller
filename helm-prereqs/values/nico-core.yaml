## =============================================================================
## nico-core.yaml — values for: helm upgrade --install nico ./helm
##
## Image registry and tag are injected at install time via --set flags:
##   --set global.image.repository=<your-registry>/nvmetal-carbide
##   --set global.image.tag=<tag>
## In setup.sh these come from NICO_IMAGE_REGISTRY and NICO_CORE_IMAGE_TAG.
## =============================================================================

global:
  image:
    repository: ""    # set via --set global.image.repository (NICO_IMAGE_REGISTRY env var)
    tag: ""           # set via --set global.image.tag (NICO_CORE_IMAGE_TAG env var)
    pullPolicy: IfNotPresent

  ## setup.sh creates a secret named `imagepullsecret` in nico-system from
  ## REGISTRY_PULL_SECRET (host nvcr.io). Reference that name here.
  imagePullSecrets:
    - name: imagepullsecret

  ## SPIFFE cert settings — vault-nico-issuer is configured by nico-prereqs
  certificate:
    duration: 720h0m0s
    renewBefore: 360h0m0s
    privateKey:
      algorithm: ECDSA
      size: 384
    issuerRef:
      kind: ClusterIssuer
      name: vault-nico-issuer
      group: cert-manager.io

  spiffe:
    trustDomain: nico.local

## ---------------------------------------------------------------------------
## nico-api — site-specific config and hostname
##
## hostname: external hostname for the nico-api service (DNS / load-balancer
##           entry point). Used for TLS SAN and API URL generation.
##
## siteConfig: TOML block consumed by nico-api at startup. Every field
##   below must be present (or explicitly commented out) so operators know
##   what is available. Replace placeholder values with real site data.
## ---------------------------------------------------------------------------
nico-api:
  hostname: "api-dev8.frg.nvidia.com"   # dev8 nico-api hostname

  ## Trust admin-CLI client certs minted from the site CA (CN=site-root) so admin-cli works
  ## with NO manual ConfigMap edit. Pair with helm-prereqs vault.nicoCliClientRole (ou: "Invalid").
  auth:
    additionalIssuerCns:
      - "site-root"

  ## MetalLB VIP for the nico-api LoadBalancer service.
  ## Must be an IP within your external IPAddressPool (values/metallb-config.yaml).
  ## This IP must resolve from your external DNS to the hostname above.
  externalService:
    enabled: true    # must be explicitly enabled - defaults to false in chart
    annotations:
      metallb.universe.tf/loadBalancerIPs: "10.180.126.241"  # dev8 nico-api external VIP

  ## TLS cert SANs.
  ##
  ## The chart auto-includes `nico-api.<release-ns>.svc.cluster.local` and the
  ## short DNS name. Add every external hostname clients use here, so the
  ## TLS handshake validates the cert against whichever name was used to
  ## reach the service. For dual-deployment compatibility with existing DPU
  ## agents (which are hardcoded to look up `carbide-api.forge`) include the
  ## `.forge` aliases below. See helm-prereqs/README.md → "DPU compatibility
  ## DNS (.forge zone)" for the full hostname list.
  certificate:
    extraDnsNames:
      - "api-dev8.frg.nvidia.com"      # dev8 external hostname (matches nico-api.hostname)
      - "carbide-api.forge"            # legacy hardcoded lookup in deployed DPU agents
      - "nico-api.forge"               # renamed-binary alias (dual naming)
      - "carbide-api.forge-system.svc.cluster.local"  # legacy cluster-internal name from forged kustomize

  siteConfig:
    enabled: true
    nicoApiSiteConfig: |
      # -----------------------------------------------------------------------
      # Site identity (dev8 — mirrors forged carbide-api-site-config.toml)
      # -----------------------------------------------------------------------
      sitename = "dev8"
      initial_domain_name = "dev8.frg.nvidia.com"
      attestation_enabled = false
      max_concurrent_machine_updates = 20

      # -----------------------------------------------------------------------
      # DHCP servers reachable from this site
      # -----------------------------------------------------------------------
      dhcp_servers = ["10.180.126.224"]          # dev8 nico-dhcp VIP (internal pool)

      # -----------------------------------------------------------------------
      # BGP route servers — dev8 used 3 FRR route servers (frrouting VIPs
      # .227/.232/.233). NICo Core has no FRR subchart, so route servers are
      # disabled here. Re-enable + point at FRR VIPs if FRR is deployed
      # out-of-band and DPU data-plane fabric BGP is required.
      # -----------------------------------------------------------------------
      route_servers = []
      enable_route_servers = false
      # route_servers = ["10.180.126.227", "10.180.126.232", "10.180.126.233"]
      # enable_route_servers = true

      # -----------------------------------------------------------------------
      # site_fabric_prefixes: prefixes that ARE part of the site fabric.
      # deny_prefixes: prefixes instances must NOT reach (OOB, ctrl-plane, underlay).
      # -----------------------------------------------------------------------
      site_fabric_prefixes = ["10.180.63.96/29"]

      deny_prefixes = [
        "10.180.63.88/29",      # admin/OOB network
        "10.180.244.65/26",     # control plane OOB
        "10.180.249.192/28",    # RNO1-M04-D05-IPMITOR-01 underlay
      ]

      # -----------------------------------------------------------------------
      # Site explorer — periodic background scan of site inventory
      # -----------------------------------------------------------------------
      [site_explorer]
      run_interval = "30s"

      # -----------------------------------------------------------------------
      # Machine + BOM validation (dev8)
      # -----------------------------------------------------------------------
      [machine_validation_config]
      enabled = true

      [bom_validation]
      enabled = true
      ignore_unassigned_machines = true

      # -----------------------------------------------------------------------
      # IP / integer pools — nico-api allocates from these ranges
      # -----------------------------------------------------------------------
      [pools.lo-ip]
      type = "ipv4"
      ranges = [{ start = "10.180.63.116", end = "10.180.63.126" }]

      [pools.vlan-id]
      type = "integer"
      ranges = [{ start = "100", end = "501" }]

      [pools.vni]
      type = "integer"
      ranges = [{ start = "1024500", end = "1024800" }]

      [pools.vpc-vni]
      type = "integer"
      ranges = [{ start = "0", end = "100" }]

      # -----------------------------------------------------------------------
      # Networks — named L3 segments visible to nico-api (dev8)
      # -----------------------------------------------------------------------
      [networks.admin]
      type = "admin"
      prefix = "10.180.63.88/29"
      gateway = "10.180.63.89"
      mtu = 9000
      reserve_first = 5

      [networks.RNO1-M04-D05-IPMITOR-01]
      type = "underlay"
      prefix = "10.180.249.192/28"
      gateway = "10.180.249.193"
      mtu = 1500
      reserve_first = 2

      # -----------------------------------------------------------------------
      # InfiniBand (no IB fabric at dev8)
      # -----------------------------------------------------------------------
      [ib_config]
      enabled = false

      [ib_fabric_monitor]
      enabled = false

      # -----------------------------------------------------------------------
      # Firmware management
      # -----------------------------------------------------------------------
      [firmware_global]
      autoupdate = false
      no_reset_retries = true

      # -----------------------------------------------------------------------
      # Machine state controller
      # -----------------------------------------------------------------------
      [machine_state_controller]
      failure_retry_time = "90m"

## ---------------------------------------------------------------------------
## Service VIP assignments - MetalLB loadBalancerIPs
##
## Each NICo Core service that exposes a LoadBalancer needs a specific IP from
## your MetalLB pool. Without these, MetalLB assigns IPs randomly from the
## pool on each install - making DHCP relay, DNS, PXE, and API hostname DNS
## records impossible to pre-configure.
##
## Rules:
##   - IPs must be within a range defined in values/metallb-config.yaml
##   - Internal pool (cluster-facing): DHCP, PXE, SSH console, NTP, DNS
##   - External pool (client-facing):  nico-api
##   - Each IP must be unique across all services
##   - The nico-api IP must resolve from external DNS to the hostname above
##
## These values mirror the kustomization patches that nicod applies via
## site-controller. Without them the services come up with unpredictable IPs.
## ---------------------------------------------------------------------------

nico-dhcp:
  externalService:
    enabled: true    # must be explicitly enabled - defaults to false in chart
    annotations:
      metallb.universe.tf/loadBalancerIPs: "10.180.126.224"  # dev8 DHCP VIP (internal pool)

  ## DHCP hook libraries' advertised IPs.
  ##
  ## Kea's libdhcp hook writes these IPs into the DHCP response that DPUs
  ## and bare-metal hosts receive on boot. They MUST be reachable on the
  ## PXE / management network the DPU comes up on, and they MUST match
  ## the externalService VIPs assigned to nico-dns / nico-ntp / nico-pxe
  ## above.
  ##
  ## Leaving the chart defaults (127.0.0.1) causes the symptoms reported
  ## against helm-deployed sites — DPU pre-ingestion fails with clock
  ## divergence (no NTP) and the DPU agent cannot reach the API endpoint
  ## (no DNS).
  ##
  ## Cross-check: each value below should equal the corresponding
  ## externalService loadBalancerIPs annotation in this file.
  ##
  ## DUAL-DEPLOYMENT NOTE (PR #2062): if the NICo API is installed under
  ## the legacy `carbide-api` name on this site, ALSO set
  ## `nico-dhcp.apiServiceName: carbide-api` (uncomment the line below)
  ## so the kea hook generates the right `nico-api-url` for DPUs. Without
  ## this, the hook advertises https://nico-api.<ns>.svc.cluster.local
  ## which will NXDOMAIN against a carbide-api-only deployment.
  # apiServiceName: carbide-api
  config:
    kea:
      hookParameters:
        # DPUs need a resolver that serves the .forge zone (carbide-api.forge etc.).
        # In forged, that was the unbound VIP (10.180.126.238). nico-dns is
        # authoritative-only and does not serve .forge, so we hand DPUs the
        # unbound VIP. NOTE: requires unbound to be reachable at this VIP — see
        # todos/dev8-install.md OPEN ITEM #1 (unbound Service is ClusterIP by default).
        nameservers: "10.180.126.238"                      # dev8 unbound VIP
        ntpServer: "10.180.126.229,10.180.126.230,10.180.126.231"  # dev8 nico-ntp per-pod VIPs
        provisioningServer: "10.180.126.226"               # dev8 nico-pxe VIP

nico-dns:
  externalService:
    enabled: true    # must be explicitly enabled - defaults to false in chart
    ## DNS uses perPodAnnotations because each replica gets its own VIP.
    ## The chart creates separate UDP + TCP services per pod and uses
    ## metallb.universe.tf/allow-shared-ip so both share the same IP.
    perPodAnnotations:
      - metallb.universe.tf/loadBalancerIPs: "10.180.126.244"  # dev8 DNS instance-0 VIP (external pool)
      - metallb.universe.tf/loadBalancerIPs: "10.180.126.243"  # dev8 DNS instance-1 VIP (external pool)

nico-pxe:
  externalService:
    enabled: true    # must be explicitly enabled - defaults to false in chart
    annotations:
      metallb.universe.tf/loadBalancerIPs: "10.180.126.226"  # dev8 PXE VIP (internal pool)

  ## Boot artifacts (ipxe.efi, BFB, OS images) — REQUIRED or DPU/host HTTP boot 404s and
  ## falls back to the local OS (never re-images). These init containers populate the
  ## /boot-artifacts/blobs/internal volume that nico-pxe serves at /public/blobs/internal.
  ## Pinned to the same build as nvmetal-carbide (v2.0.0-pr-70-g7591be0f), carbide-dev registry.
  bootArtifactContainers:
    - name: boot-artifacts-x86-64
      image: nvcr.io/0837451325059433/carbide-dev/boot-artifacts-x86_64:v2.0.0-pr-70-g7591be0f
      command: ["sh", "-c", "cp -r /x86_64 /boot-artifacts/blobs/internal"]
    - name: boot-artifacts-aarch64
      image: nvcr.io/0837451325059433/carbide-dev/boot-artifacts-aarch64:v2.0.0-pr-70-g7591be0f
      # NOTE: this image build has /aarch64 + /apt but NO /firmware (chart example is wrong) — don't add /firmware.
      command: ["sh", "-c", "cp -r /aarch64 /apt /boot-artifacts/blobs/internal"]

  ## TLS cert SANs — DPU agents are hardcoded to fetch boot artifacts from
  ## `carbide-pxe.forge` / `carbide-static-pxe.forge`. If the cert doesn't
  ## include those names, BMC HttpBootUri / agent calls fail TLS validation.
  certificate:
    extraDnsNames:
      - "carbide-pxe.forge"            # legacy hardcoded lookup in deployed DPU agents
      - "nico-pxe.forge"               # renamed-binary alias (dual naming)
      - "carbide-static-pxe.forge"     # legacy hardcoded lookup in host PXE loaders
      - "carbide-pxe.forge-system.svc.cluster.local"  # legacy cluster-internal name

nico-ssh-console-rs:
  ## imagePullSecrets now inherited from global.imagePullSecrets (chart fix: this subchart
  ## falls back to global). No per-subchart override needed.
  externalService:
    enabled: true    # must be explicitly enabled - defaults to false in chart
    annotations:
      metallb.universe.tf/loadBalancerIPs: "10.180.126.228"  # dev8 SSH console VIP (internal pool)

## ---------------------------------------------------------------------------
## nico-ntp - chrony NTP servers
##
## Deploys a 3-replica chrony StatefulSet plus per-pod LoadBalancer Services.
## Each replica gets a stable MetalLB VIP that DPUs and bare-metal hosts sync
## against (advertised to them via nico-dhcp.config.kea.hookParameters.ntpServer
## above). Enabled by default — DPU pre-ingestion fails on clock divergence,
## so the chart deploys NTP unless you disable it here.
## ---------------------------------------------------------------------------
nico-ntp:
  externalService:
    enabled: true    # must be explicitly enabled - defaults to false in chart
    ## NTP uses perPodAnnotations - one VIP per replica so clients can reach
    ## each NTP instance at a stable IP regardless of pod scheduling.
    perPodAnnotations:
      - metallb.universe.tf/loadBalancerIPs: "10.180.126.229"  # dev8 NTP instance-0 VIP (internal pool)
      - metallb.universe.tf/loadBalancerIPs: "10.180.126.230"  # dev8 NTP instance-1 VIP (internal pool)
      - metallb.universe.tf/loadBalancerIPs: "10.180.126.231"  # dev8 NTP instance-2 VIP (internal pool)

## ---------------------------------------------------------------------------
## nico-dsx-exchange-consumer - disabled until binary is included in image
## ---------------------------------------------------------------------------
nico-dsx-exchange-consumer:
  enabled: false

## ---------------------------------------------------------------------------
## unbound - recursive DNS + DPU-compatibility .forge zone
##
## REQUIRED for DPU bring-up. Existing DPU agent binaries are hardcoded to
## look up `carbide-pxe.forge`, `carbide-ntp.forge`, `carbide-api.forge`, etc.
## Those names will not exist in cluster DNS, so they must be resolved by an
## authoritative DNS server reachable from the OOB management network. This
## chart deploys unbound with a `nico_forge_zone.conf` local-data block that
## maps each legacy hostname to the corresponding MetalLB VIP assigned above.
##
## If you point your own external DNS at the same VIPs and serve the .forge
## records there, you can leave this disabled. Otherwise enable it and fill
## the VIPs to match the externalService.annotations entries above.
##
## Verify after install: `helm-prereqs/health-check.sh` reports per-record
## status under the ".forge DNS Endpoint Reference" section.
## ---------------------------------------------------------------------------
unbound:
  enabled: true

  ## unbound uses its own images (not global.image). Pinned to the versions
  ## dev8/forged ran. Hosted under nvcr.io/nvidian/nvforge (NOT -devel) but the
  ## same host nvcr.io, so the `imagepullsecret` works. (imagePullSecrets now
  ## inherited from global via chart fix — no per-subchart override needed.)
  image:
    repository: nvcr.io/nvidian/nvforge/unbound
    tag: "3b089e6"
  exporterImage:
    repository: nvcr.io/nvidian/nvforge/unbound_exporter
    tag: "7561033"

  ## In-chart LoadBalancer VIP (chart fix) so DPUs reach unbound for .forge — replaces the
  ## old site-overlay. Must match nico-dhcp.config.kea.hookParameters.nameservers (10.180.126.238).
  externalService:
    enabled: true
    annotations:
      metallb.universe.tf/loadBalancerIPs: "10.180.126.238"  # dev8 unbound VIP (internal pool)

  ## Upstream recursive forwarder. The chart default forwarders.conf is a broken
  ## `patchme` placeholder; override it with dev8's upstream resolver (matches
  ## forged unbound forwarders.conf).
  localConfig:
    forwarders.conf: |
      forward-zone:
          name: .
          forward-addr: 10.217.0.11

  ## DPU-compatibility .forge zone (mirrors dev8 forged local_data.conf).
  ## Each entry becomes a `local-data ... IN A` line. We serve both legacy
  ## carbide-* and new nico-* names under the same VIPs (dual naming).
  ## NOTE: unbound's Service is ClusterIP by default — DPUs reach it via the VIP
  ## handed out by DHCP (nico-dhcp.config.kea.hookParameters.nameservers =
  ## 10.180.126.238). See todos/dev8-install.md OPEN ITEM #1 for exposing unbound
  ## at that VIP (chart Service has no externalService support yet).
  localData:
    - name: carbide-api.forge
      addresses: ["10.180.126.241"]
    - name: nico-api.forge
      addresses: ["10.180.126.241"]
    - name: carbide-pxe.forge
      addresses: ["10.180.126.226"]
    - name: nico-pxe.forge
      addresses: ["10.180.126.226"]
    - name: carbide-static-pxe.forge
      addresses: ["10.180.126.226"]
    - name: carbide-ntp.forge
      addresses: ["10.180.126.229", "10.180.126.230", "10.180.126.231"]
    - name: nico-ntp.forge
      addresses: ["10.180.126.229", "10.180.126.230", "10.180.126.231"]
    - name: unbound.forge
      addresses: ["10.180.126.238"]
