# Teleport provision-token for nvcert site-controller SSH node enrollment (TPM join).
# Same structure as launchpad-deploy/teleport/launchpad-token.yaml.
#
# FILL_ME: after running install_teleport.sh on each CP node, copy the ek_public_hash
# from each node's `sudo tbot tpm identify` output into the allow list below.
#
# REGISTER on nv-stg (admin with tctl access):
#   tsh login --proxy=nv-stg-dgxc.teleport.sh
#   tctl create -f nvcert-token.yaml        # first time
#   tctl create -f nvcert-token.yaml        # safe to re-run to add/update EKs
#
# Token name MUST match TELEPORT_TOKEN in run_on_node.sh.
kind: token
version: v2
metadata:
  name: rg-forge-launchpad-nvcert-nodes-tpm
spec:
  roles: [Node]
  join_method: tpm
  tpm:
    allow:
      - description: "gb300control01"
        ek_public_hash: "37e5866f572e1868db2e8a54bd8f9d381c955f96b540b09b629b8ee79e8a79b9"
      - description: "gb300control02"
        ek_public_hash: "bd0990b69a59e3b79095563b5eeb6c1f8b033cadaae73147b3bdf19b053efa27"
      - description: "gb300control03"
        ek_public_hash: "9306c74f7b8de42c6514a5b309482d6802fd670d388827db11153c2fe3d40810"   # run: sudo tbot tpm identify  on gb300control03
      # Add more nodes (cp-4 through cp-13) here as needed, same pattern.
